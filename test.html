<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 48px 24px; }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 32px; margin-bottom: 8px; }
    p { color: #666; }
    .input-container { background: #f5f5f5; border: 2px solid #ddd; border-radius: 16px; padding: 16px; margin-bottom: 24px; }
    .input-container input { width: 100%; padding: 14px; border: none; font-size: 16px; min-height: 56px; }
    .btn-add { width: 100%; padding: 14px; background: #7c3aed; color: white; border: none; border-radius: 12px; font-size: 15px; margin-top: 12px; cursor: pointer; }
    .btn-add:hover { background: #6d28d9; }
    ul { list-style: none; }
    li { background: #f5f5f5; border: 1px solid #ddd; border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; }
    button.btn-delete { padding: 8px 14px; border: 1px solid #ddd; border-radius: 10px; background: transparent; color: #666; font-size: 13px; cursor: pointer; }
    button.btn-delete:hover { background: #fecaca; color: #dc2626; border-color: #dc2626; }
    .empty-state { text-align: center; padding: 64px 24px; background: #f5f5f5; border-radius: 16px; }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; color: #666; margin-bottom: 8px; }
    .empty-state p { font-size: 15px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <h1>待办任务</h1>
    <p>测试页面 - 如果这里显示正常，说明浏览器没问题</p>
    
    <div class="input-container">
      <input type="text" placeholder="输入测试任务..." />
      <button class="btn-add">添加任务</button>
    </div>
    
    <ul>
      <div class="empty-state">
        <div class="icon">✨</div>
        <h3>暂无任务</h3>
        <p>在上面输入任务内容</p>
      </div>
    </ul>
  </div>
</body>
</html>
